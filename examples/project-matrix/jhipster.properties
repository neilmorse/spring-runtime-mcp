server.address=127.0.0.1
server.port=0
server.servlet.context-path=/
management.server.address=127.0.0.1
management.server.port=0
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,beans,conditions,mappings,startup,liquibase,flyway,env,configprops,openapi
management.endpoints.access.default=read-only
management.endpoint.health.show-details=when_authorized
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.health.mail.enabled=false
management.otlp.metrics.export.enabled=false
spring.application.name=diagnostics-jhipster
spring.datasource.url=jdbc:h2:mem:diagnostics_jhipster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.docker.compose.enabled=false
spring.devtools.restart.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off
springdoc.use-management-port=true
springdoc.swagger-ui.enabled=false
spring.profiles.active=dev,api-docs
application.liquibase.async-start=false
spring.liquibase.contexts=dev
