server.address=127.0.0.1
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,beans,conditions,mappings,startup,env,configprops,flyway
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.health.mail.enabled=false
management.prometheus.metrics.export.enabled=false
management.tracing.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.main.lazy-initialization=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.profiles.active=prod
spring.ai.chat.client.enabled=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=120000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration/h2
common.queue.type=memory
warehouse.store.jpa.enabled=true
warehouse.store.victoria-metrics.enabled=false
warehouse.store.greptime.enabled=false
warehouse.store.iot-db.enabled=false