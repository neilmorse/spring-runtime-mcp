spring.profiles.active=diagnostics
spring.application.name=flowable-large-diagnostics
management.endpoint.health.roles=ROLE_DIAGNOSTICS
spring.datasource.url=jdbc:h2:mem:flowable_large_diagnostics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
flowable.rest.app.create-demo-definitions=false
flowable.rest.app.jms-enabled=false
flowable.rest.app.rabbit-enabled=false
flowable.rest.app.kafka-enabled=false
flowable.async-executor-activate=false
flowable.async-history-executor-activate=false
