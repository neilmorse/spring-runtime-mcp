server.address=127.0.0.1
server.servlet.context-path=/
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=beans,conditions,mappings,health,startup,info,env,configprops,flyway,liquibase
management.endpoints.access.default=read-only
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=DIAGNOSTICS
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.health.jms.enabled=false
management.health.rabbit.enabled=false
management.health.ldap.enabled=false
management.info.java.enabled=true
management.info.env.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.main.lazy-initialization=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.h2.console.enabled=false
spring.sql.init.mode=never
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.kubernetes.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false
