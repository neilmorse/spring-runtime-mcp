server.address=127.0.0.1
server.servlet.context-path=/
server.ssl.enabled=false
management.server.ssl.enabled=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,beans,conditions,mappings,startup,env,configprops,liquibase
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=DIAGNOSTICS
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.health.jms.enabled=false
management.health.rabbit.enabled=false
management.health.ldap.enabled=false
management.info.java.enabled=true
management.info.env.enabled=false
management.prometheus.metrics.export.enabled=false
management.otlp.metrics.export.enabled=false
management.tracing.enabled=false
management.metrics.export.cloudwatch.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.main.lazy-initialization=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.sql.init.mode=never
spring.liquibase.enabled=true
spring.application.name=fineract-ultra-diagnostics
spring.profiles.active=ultra-local
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
fineract.security.basicauth.enabled=true
fineract.security.oauth.enabled=false
fineract.security.2fa.enabled=false
fineract.mode.read-enabled=true
fineract.mode.write-enabled=true
fineract.mode.batch-manager-enabled=false
fineract.mode.batch-worker-enabled=false
fineract.remote-job-message-handler.spring-events.enabled=false
fineract.remote-job-message-handler.jms.enabled=false
fineract.remote-job-message-handler.kafka.enabled=false
fineract.external-events.enabled=false