spring.config.name=thingsboard
spring.application.name=thingsboard-production-chaos
spring.profiles.active=default
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
management.endpoint.health.show-details=always
queue.type=in-memory
queue.edqs.mode=local
cache.type=caffeine
zookeeper.enabled=false
transport.http.enabled=false
transport.mqtt.enabled=false
transport.coap.enabled=false
transport.lwm2m.enabled=false
transport.snmp.enabled=false
updates.enabled=false
edges.enabled=false
service.type=monolith
js.evaluator=local
spring.main.allow-circular-references=true
install.load_demo=false
