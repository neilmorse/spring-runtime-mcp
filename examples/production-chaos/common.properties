server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/
management.server.port=8080
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=beans,conditions,mappings,health,startup,env,configprops,flyway,liquibase
management.endpoints.access.default=read-only
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=DIAGNOSTICS
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.health.mail.enabled=false
management.health.ldap.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=false
spring.main.allow-circular-references=false
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=500
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.enabled=false
diagnostics.optional=false
