spring.application.name=dolphinscheduler-production-chaos
server.jetty.accesslog.enabled=false
management.security.enabled=false
management.health.db.enabled=true
management.health.chaosDependency.enabled=true
management.endpoint.health.show-details=always
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
worker.tenant-config.auto-create-tenant-enabled=false
api.python-gateway.enabled=false
