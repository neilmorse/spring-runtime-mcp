name: Publish approved 0.2.3 Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-0.2.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'neilmorse/spring-runtime-mcp' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.2.3
      - name: Verify approved source and public package ownership
        run: |
          test "$(git rev-parse HEAD)" = 3f752dc46f8f5b9344bdfbde15597b95f3dd6670
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          metadata = json.loads(Path("server.json").read_text())
          name = "io.github.neilmorse/spring-runtime-mcp"
          assert metadata["name"] == name
          assert metadata["version"] == "0.2.3"
          assert len(metadata["packages"]) == 1
          package = metadata["packages"][0]
          assert package["registryType"] == "pypi"
          assert package["identifier"] == "spring-runtime-mcp"
          assert package["version"] == "0.2.3"
          url = "https://pypi.org/pypi/spring-runtime-mcp/0.2.3/json"
          with urllib.request.urlopen(url, timeout=30) as response:
              public = json.load(response)
          assert public["info"]["version"] == "0.2.3"
          marker = re.escape("mcp-name: " + name) + r"(?=\s|<|-->|$)"
          assert re.search(marker, public["info"]["description"])
          print("Approved source, version and public package ownership marker verified.")
          PY
      - name: Install pinned official publisher
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/mcp-publisher-bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher-bin" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher-bin" >> "$GITHUB_PATH"
      - name: Validate metadata
        run: mcp-publisher validate server.json
      - name: Authenticate using short-lived GitHub OIDC identity
        run: mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
      - name: Publish approved metadata
        run: mcp-publisher publish server.json
      - name: Verify exact Registry entry
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          name = "io.github.neilmorse/spring-runtime-mcp"
          query = urllib.parse.urlencode({"search": name})
          url = "https://registry.modelcontextprotocol.io/v0.1/servers?" + query
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          assert any(
              item.get("server", {}).get("name") == name
              and item["server"].get("version") == "0.2.3"
              for item in payload.get("servers", [])
          )
          print("Registry entry confirmed: " + name + " 0.2.3")
          PY
