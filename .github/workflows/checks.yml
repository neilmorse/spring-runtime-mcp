name: Shared validation

on:
  workflow_call:
    inputs:
      full-release-gate:
        type: boolean
        default: false
      verify-release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --locked
      - name: Offline fixture tests
        run: uv run --no-sync python -m pytest -q
      - name: Tool contract validation
        run: uv run --no-sync python scripts/validate_tool_contract.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run --no-sync python -m mypy src/spring_runtime_mcp
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts

  release-gate:
    name: Strict release gate and verified artifacts
    if: inputs.full-release-gate || inputs.verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: "3.12"
      - run: uv sync --dev --locked
      - name: Warm default-index cache with hash-locked dependencies
        run: |
          uv export --frozen --all-groups --no-editable --no-emit-project -o "$RUNNER_TEMP/release-cache-requirements.txt"
          uv venv "$RUNNER_TEMP/release-cache-venv"
          uv pip install --python "$RUNNER_TEMP/release-cache-venv/bin/python" --require-hashes -r "$RUNNER_TEMP/release-cache-requirements.txt"
      - name: Verify package and registry versions
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from spring_runtime_mcp import __version__
          metadata = json.load(open("server.json"))
          assert metadata["version"] == __version__
          assert all(p["version"] == __version__ for p in metadata["packages"])
          PY
      - name: Verify release tag matches package version
        if: inputs.verify-release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-sync python -c 'import os; from spring_runtime_mcp import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Full release gate (no bypass flags)
        run: uv run --no-sync python scripts/pre_release_check.py --audit --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
